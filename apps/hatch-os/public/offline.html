<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Can’t reach Hatch</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c2340" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <style>
    :root { --ink: #0c2340; --cream: #f5f2ed; --muted: #5c5c5c; --accent: #E1523F; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 28rem; }
    .brand { margin: 0 0 28px; }
    .brand img { height: 36px; width: auto; }
    h1 { font-size: 28px; letter-spacing: -0.035em; line-height: 1.15; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand"><img src="/brand/boundaries-logo.svg" alt="Boundaries Coffee" /></p>
    <h1>Can’t reach Hatch.</h1>
    <p>Join the office network or the firm VPN, then retry. This phone does not keep a local copy of the library.</p>
    <a href="/ask">Retry</a>
  </main>
</body>
</html>
