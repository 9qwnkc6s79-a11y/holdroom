<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hatch is offline</title>
  <meta name="theme-color" content="#09090B" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #09090B;
      color: #FAFAFA;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main { width: min(420px, 100%); }
    .mark { margin: 0 0 18px; font-size: 28px; letter-spacing: -0.04em; font-weight: 600; }
    h1 { font-size: 28px; letter-spacing: -0.03em; line-height: 1.2; margin: 0 0 12px; font-weight: 600; }
    p { color: #A1A1AA; line-height: 1.55; margin: 0 0 24px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      background: #FAFAFA;
      color: #09090B;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p class="mark">Hatch</p>
    <h1>Hatch is offline on this device.</h1>
    <p>Open the app again when this phone has a connection to your firm’s Hatch OS.</p>
    <a href="/chat">Try again</a>
  </main>
</body>
</html>
